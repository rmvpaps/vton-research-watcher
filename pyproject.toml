[project]
name = "vton-research-watcher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "bs4>=0.0.2",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "sqlmodel>=0.0.38",
    "pillow>=12.2.0",
    "markitdown[pdf]>=0.1.5",
    "pgvector>=0.4.2",
    "fastapi[standard]>=0.136.1",
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.12",
    "mangum>=0.21.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "respx>=0.23.1",
    "pytest-asyncio>=1.3.0",
    "pytest-freezer>=0.4.9",
    "pytest-mock>=3.15.1",
]

[project.optional-dependencies]
processor = [
    "keybert>=0.9.0",
    "openai>=2.32.0",
    "sentence-transformers>=5.4.1",
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
package = true
# This forces the resolution to use the CPU version for ALL dependencies
override-dependencies = [
    "torch==2.11.0+cpu",
    "torchvision==0.20.1+cpu"
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["shared*", "scraper*", "processor*", "api*"] 

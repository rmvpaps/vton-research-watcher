version: 0.2
env:
  # 1. Ensure the fallback or primary name variable is declared
  variables:
    # This must match the exact key passed down by your CodePipeline/GitHub Actions environment env context
    CLUSTER_NAME: "research-watcher" 
    MIGRATE_TASK_NAME: "aws-migrate-helper"
    SCRAPER_TASK_NAME: "aws-scraper"
phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      - echo "Installing uv..."
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - echo attempting docker
      - aws ecr get-login-password | docker login --username AWS --password-stdin $REPOSITORY_URI
    finally:
      - echo Install and docker login stage over 

  build:
    commands:
      - echo Entered the build phase...
      - echo Build started on `date`
      - echo "Building image..."
      - docker build -t scraper:v0 -f Dockerfile_scraper .
      - echo "Running Tests inside the container..."
      # If this fails, the whole build fails and stops here
      - docker run scraper:v0 uv run pytest tests/scraper/
    finally:
      - echo Docker image build and test over

  post_build:
    commands:
      - echo Entered the post_build phase...
      - echo Build completed on `date`
      - echo "Tests passed! Pushing to ECR..."
      - docker tag scraper:v0 $REPOSITORY_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION
      - docker push $REPOSITORY_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION
      
      - echo "Registering migration task..."
      - |
        RAW_DEF=$(aws ecs describe-task-definition --task-definition "$MIGRATE_TASK_NAME" --query 'taskDefinition' --output json)
        NEW_TASK_DEF=$(echo $RAW_DEF | jq --arg IMAGE "$REPOSITORY_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION" '
          .containerDefinitions[0].image = $IMAGE | 
          del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
        ')
        NEW_REVISION_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)
      
      - echo "Running Migrations..."
      # Wrap the entire command in quotes or use the pipe block to avoid YAML parsing errors
      - |
        TASK_ARN=$(aws ecs run-task \
          --cluster "$CLUSTER_NAME" \
          --task-definition "$NEW_REVISION_ARN" \
          --count 1 \
          --launch-type FARGATE \
          --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_ID],securityGroups=[$SG_ID],assignPublicIp=ENABLED}" \
          --query 'tasks[0].taskArn' --output text)
      
      - echo "Waiting for migration to finish..."
      - aws ecs wait tasks-stopped --cluster "$CLUSTER_NAME" --tasks $TASK_ARN
      
      - echo "Checking migration exit code..."
      - |
        EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER_NAME" --tasks $TASK_ARN --query 'tasks[0].containers[0].exitCode' --output text)
        if [ "$EXIT_CODE" -ne "0" ]; then
          echo "Migration failed with exit code $EXIT_CODE. Aborting."
          exit 1
        fi

      - echo "Updating scraper task..."
      - |
        RAW_SCRAPER=$(aws ecs describe-task-definition --task-definition "$SCRAPER_TASK_NAME" --query 'taskDefinition' --output json)
        NEW_SCRAPER_DEF=$(echo $RAW_SCRAPER | jq --arg IMAGE "$REPOSITORY_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION" '
          .containerDefinitions[0].image = $IMAGE | 
          del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
        ')
        SCRAPER_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_SCRAPER_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)

      - echo "Updating EventBridge Target..."
      - |
        # 1. Construct the Targets JSON safely
        TARGETS_JSON='[
          {
            "Id": "1",
            "Arn": "'$MY_TARGET_ARN'",
            "RoleArn": "'$MY_ROLE_ARN'",
            "EcsParameters": {
              "TaskDefinitionArn": "'$SCRAPER_ARN'",
              "TaskCount": 1,
              "LaunchType": "FARGATE",
              "NetworkConfiguration": {
                "awsvpcConfiguration": {
                  "Subnets": ["'$SUBNET_ID'"],
                  "SecurityGroups": ["'$SG_ID'"],
                  "AssignPublicIp": "ENABLED"
                }
              }
            }
          }
        ]'
        
        # 2. Pass the variable to the CLI
        aws events put-targets --rule $MY_CRON_RULE --targets "$TARGETS_JSON"